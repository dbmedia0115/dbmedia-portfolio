name: Keep Supabase Awake

# Supabase free-tier projects pause after 7 days with no database activity.
# This job pings the database twice a week (Mon + Thu), so the timer never
# runs out and the site never goes to sleep. Runs automatically, free forever.

on:
  schedule:
    - cron: "17 6 * * 1,3,5"   # 06:17 UTC every Monday, Wednesday and Friday
  workflow_dispatch:          # lets you also run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to keep it awake..."
          curl -sS -o /dev/null -w "Response: HTTP %{http_code}\n" \
            "https://dktuxcqjrvpzhtcvhjvl.supabase.co/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: sb_publishable_v06XMnd_nvUi-tzA_eviug_M4KEobnk" \
            -H "Authorization: Bearer sb_publishable_v06XMnd_nvUi-tzA_eviug_M4KEobnk"
